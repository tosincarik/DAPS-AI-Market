chart_analysis_task:
  description: >
    Analyse the recent price performance of {stock_symbol} using {{ stock_data }}.
    Identify bullish or bearish trends, calculate key technical indicators
    (RSI, MACD, moving averages), and provide key prices.
  expected_output: >
    {
      "trend": "<upward/downward/neutral>",
      "rationale": "<brief explanation of trend>",
      "confidence": "<float between 0 and 1>",
      "technical_indicators": {
        "RSI": "<float>",
        "MACD": "<float>",
        "moving_averages": {
          "short_term": "<float>",
          "long_term": "<float>"
        }
      },
      "key_prices": {
        "latest_close": "<float>",
        "recent_high": "<float>",
        "recent_low": "<float>"
      }
    }
  agent: chart_analyst
  output_file: output/chart_analysis.md

news_sentiment_task:
  description: >
    Analyse the latest news for {news_topic} using {{ news_data }}.
    Determine overall sentiment, highlight top impactful news items,
    and provide confidence in analysis.
  expected_output: >
    {
      "sentiment": "<positive/negative/neutral>",
      "rationale": "<brief explanation of sentiment>",
      "confidence": "<float between 0 and 1>",
      "top_news_items": [
        {
          "title": "<string>",
          "date": "<YYYY-MM-DD>",
          "summary": "<string>",
          "sentiment_score": "<float>"
        }
      ]
    }
  agent: news_analyst
  output_file: output/news_analysis.md

dap_consensus_task:
  description: >
    Combine outputs from chart_analyst and news_analyst using the DAP Protocol.
    Produce a weighted consensus recommendation with justification.
  expected_output: >
    {
      "final_recommendation": "<Buy/Hold/Sell>",
      "justification": "<human-readable explanation combining chart and news analysis>",
      "overall_confidence": "<float between 0 and 1>",
      "technical_indicators": {
        "RSI": "<float>",
        "MACD": "<float>",
        "moving_averages": {
          "short_term": "<float>",
          "long_term": "<float>"
        }
      },
      "key_prices": {
        "latest_close": "<float>",
        "recent_high": "<float>",
        "recent_low": "<float>"
      },
      "news_details": [
        {
          "title": "<string>",
          "date": "<YYYY-MM-DD>",
          "summary": "<string>",
          "sentiment_score": "<float>"
        }
      ]
    }
  agent: dap_mediator
  output_file: output/mediator_decider.md
